name: Build PromptGo APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptgo-apk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Admin and User APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project files
        shell: bash
        run: |
          set -e
          test -f admin/main.dart
          test -f admin/pubspec.yaml
          test -f user/main.dart
          test -f user/pubspec.yaml
          test -f user/assets/icon.png
          test -f user/assets/sp.png
          test -f user/assets/sp1.png
          test -f user/assets/caver.JPG
          test -f user/assets/admin.JPG
          test -f user/assets/upd.png
          test -f user/assets/upl.png
          test -f user/assets/nol.png
          test -f user/assets/nod.png
          echo "Required source files and assets are present."

      - name: Generate Admin Android project
        shell: bash
        run: |
          set -e
          flutter create --platforms=android --org com.promptgo --project-name admin admin_app
          sed -i 's/android:label="[^"]*"/android:label="PromptGo Admin"/' admin_app/android/app/src/main/AndroidManifest.xml
          if [ -f admin_app/android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.promptgo.admin"/' admin_app/android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' admin_app/android/app/build.gradle.kts
          else
            sed -i 's/applicationId "[^"]*"/applicationId "com.promptgo.admin"/' admin_app/android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' admin_app/android/app/build.gradle
          fi
          rm -rf admin_app/test
          cp admin/main.dart admin_app/lib/main.dart
          cp admin/pubspec.yaml admin_app/pubspec.yaml

      - name: Build Admin APK
        working-directory: admin_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Generate User Android project
        shell: bash
        run: |
          set -e
          flutter create --platforms=android --org com.promptgo --project-name promptgo user_app
          sed -i 's/android:label="[^"]*"/android:label="PromptGo"/' user_app/android/app/src/main/AndroidManifest.xml
          if [ -f user_app/android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.promptgo.safi"/' user_app/android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' user_app/android/app/build.gradle.kts
          else
            sed -i 's/applicationId "[^"]*"/applicationId "com.promptgo.safi"/' user_app/android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' user_app/android/app/build.gradle
          fi
          rm -rf user_app/test
          cp user/main.dart user_app/lib/main.dart
          cp user/pubspec.yaml user_app/pubspec.yaml
          cp -r user/assets user_app/assets

      - name: Build User APK
        working-directory: user_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Package APK files
        shell: bash
        run: |
          set -e
          mkdir -p output
          cp admin_app/build/app/outputs/flutter-apk/app-release.apk output/PromptGo-Admin.apk
          cp user_app/build/app/outputs/flutter-apk/app-release.apk output/PromptGo-User.apk
          cd output
          zip ../PromptGo-APKs.zip PromptGo-Admin.apk PromptGo-User.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptGo-Admin-APK
          path: output/PromptGo-Admin.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptGo-User-APK
          path: output/PromptGo-User.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: PromptGo-APKs
          path: PromptGo-APKs.zip
          if-no-files-found: error
          retention-days: 14
